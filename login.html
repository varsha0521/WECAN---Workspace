<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — WECAN</title>
<meta name="description" content="Log in to your WECAN workspace.">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-visual">
    <a href="index.html" class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">WECAN</span>
    </a>
    <div>
      <p class="quote">"WECAN replaced four different tools for our team in a single afternoon."</p>
      <p class="quote-attr">— Design lead, product studio</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <a href="index.html" class="brand" style="display:none;"></a>
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to continue to your workspace.</p>

      <form id="login-form" novalidate>
        <div class="field" id="field-email">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@company.com" autocomplete="email">
          <span class="field-error">Enter a valid email address.</span>
        </div>
        <div class="field" id="field-password">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
          <span class="field-error">Password must be at least 6 characters.</span>
        </div>
        <div class="form-row-split">
          <label class="checkbox-row">
            <input type="checkbox" id="remember-me">
            Remember me
          </label>
          <a href="#" class="link-muted">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <div class="auth-divider">or</div>
      <button type="button" class="btn btn-outline btn-block" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 015.5 12c0-.73.13-1.43.34-2.09V7.06H2.18A11 11 0 001 12c0 1.77.43 3.45 1.18 4.94z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.06l3.66 2.85C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>

      <p class="auth-foot">Don't have a workspace? <a href="signup.html">Create one</a></p>
    </div>
  </div>
</div>

<div id="toast-region"></div>

<script src="storage.js"></script>
<script src="main.js"></script>
<script>
  document.getElementById('google-btn').addEventListener('click', () => {
    showToast('This is a UI preview — Google sign-in isn\u2019t connected yet.');
  });
</script>
</body>
</html>
